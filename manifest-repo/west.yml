manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.1
      west-commands: scripts/west-commands.yml
      import: true

  self:
    path: application/manifest-repo
