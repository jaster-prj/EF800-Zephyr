manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: jaster-prj
      url-base: https://github.com/jaster-prj

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.1
      west-commands: scripts/west-commands.yml
      import: true
    - name: PluginManager
      remote: jaster-prj
      revision: 8469d290ea373ccc5abec19b49d97fdea34847c5
      path: modules/lib/PluginManager

  self:
    path: application/manifest-repo
