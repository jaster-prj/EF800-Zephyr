manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: jaster-prj
      url-base: https://github.com/jaster-prj

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.4.1
      west-commands: scripts/west-commands.yml
      import: true
    - name: PluginManager
      remote: jaster-prj
      revision: 1cc9b663898b3e3b6c7c5b8f3c15ee19967261ce
      path: modules/lib/PluginManager

  self:
    path: application/manifest-repo
