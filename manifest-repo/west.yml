manifest:
  defaults:
    remote: upstream

  remotes:
    - name: upstream
      url-base: https://github.com/zephyrproject-rtos
    - name: jaster-prj
      url-base: https://github.com/jaster-prj

  projects:
    - name: zephyr
      remote: upstream
      revision: v4.5.0
      west-commands: scripts/west-commands.yml
      import: true
    - name: PluginManager
      remote: jaster-prj
      revision: 07ad72b508f22e5ecf4787bb7f21ca30418119e1
      path: modules/lib/PluginManager
    - name: zephyr-mtp
      remote: jaster-prj
      revision: cb1cad67b79771f8b9e56d66170e8c02c3f3e5b7
      path: modules/lib/ZephyrMTP

  self:
    path: application/manifest-repo
