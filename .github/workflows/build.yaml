name: EF800 Zephyr build

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    container:
      image: ghcr.io/jaster-prj/devcontainer-zephyr-workspace:latest
      volumes:
        - /opt/hostedtoolcache:/delete-me

    steps:
      - name: Clean host tool cache mount
        run: rm -rf /delete-me/*

      - name: Link workspace
        run: ln -s /workspace ./zephyr_workspace

      - name: Checkout application
        uses: actions/checkout@v7
        with:
          path: ./zephyr_workspace/application

      - name: Select and update EF800 workspace
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west config manifest.path application/manifest-repo
          /opt/venv/bin/west config manifest.file west.yml
          /opt/venv/bin/west update
          /opt/venv/bin/west zephyr-export
          /opt/venv/bin/python -m pip install -r zephyr/scripts/requirements.txt

      - name: Install static-analysis tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends clang-tidy-22 cppcheck

      - name: Audit Python dependencies
        working-directory: ./zephyr_workspace/application
        run: |
          /opt/venv/bin/python -m pip install pip-audit
          /opt/venv/bin/pip-audit -r GSE/Virtual-EF800/requirements.txt
          /opt/venv/bin/pip-audit -r /workspace/zephyr/scripts/requirements.txt

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: c-cpp
          build-mode: manual
          queries: security-extended

      - name: Run all native tests
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west twister -T application/tests \
            -p native_sim --inline-logs --no-clean \
            -x CMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build virtual EF800 target
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b native_sim \
            application/application/ef800-application \
            --build-dir application/build/ef800-application-native-sim

      - name: Run host front-panel tests
        working-directory: ./zephyr_workspace/application
        run: |
          python -m pip install -r GSE/Virtual-EF800/requirements.txt
          python -m unittest \
            GSE/Virtual-EF800/test_virtual_frontpanel.py \
            GSE/Virtual-EF800/test_scenario_client.py \
            GSE/Virtual-EF800/test_gateway.py \
            GSE/Virtual-EF800/test_deployment.py \
            GSE/Virtual-EF800/test_web_assets.py \
            GSE/Virtual-EF800/test_compose_integration.py


      - name: Test measurement plugin SDK
        working-directory: ./zephyr_workspace/application/application/plugins/measurement-plugin
        run: |
          cmake -S . -B build/ci-host -G Ninja
          cmake --build build/ci-host
          ctest --test-dir build/ci-host --output-on-failure

      - name: Build keyboard controller
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800_keyboard \
            application/application/keyboard-application \
            --build-dir application/build/keyboard-application -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build EF800 application
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800 \
            application/application/ef800-application \
            --build-dir application/build/ef800-application -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build backup application
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800 \
            application/application/ef800-backup \
            --build-dir application/build/ef800-backup -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build second-level bootloader
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800 \
            application/application/ef800-bootloader \
            --build-dir application/build/ef800-bootloader -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build keyboard bootloader
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800_keyboard \
            application/application/keyboard-bootloader \
            --build-dir application/build/keyboard-bootloader -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build keyboard updater
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800_keyboard \
            application/application/keyboard-updater \
            --build-dir application/build/keyboard-updater -- \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build hardware debug image
        working-directory: ./zephyr_workspace
        run: |
          /opt/venv/bin/west build -p always -b ef800 \
            application/application/test-hwdebug \
            --build-dir application/build/test-hwdebug
          bash application/scripts/verify-test-hwdebug-image.sh

      - name: Verify image contract
        working-directory: ./zephyr_workspace
        run: bash application/scripts/verify-images.sh

      - name: Run focused C quality checks
        working-directory: ./zephyr_workspace
        run: |
          python3 application/scripts/run-c-quality.py \
            --workspace /workspace \
            --application /workspace/application

      - name: Finalize CodeQL
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:c-cpp"

      - name: Package development images
        working-directory: ./zephyr_workspace
        run: |
          mkdir -p application/artifacts
          cp application/build/ef800-bootloader/zephyr/zephyr.bin application/artifacts/ef800-bootloader.bin
          cp application/build/ef800-backup/zephyr/zephyr.bin application/artifacts/ef800-backup.bin
          cp application/build/ef800-application/zephyr/zephyr.bin application/artifacts/ef800-application.bin
          cp application/build/keyboard-application/zephyr/zephyr.bin application/artifacts/keyboard-application.bin

      - name: Publish images
        uses: actions/upload-artifact@v7
        with:
          name: ef800-zephyr-images
          path: zephyr_workspace/application/artifacts/
