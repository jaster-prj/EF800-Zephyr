# SPDX-License-Identifier: Apache-2.0
CONFIG_IS_BOOTLOADER=y
CONFIG_SOC_EARLY_RESET_HOOK=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000
CONFIG_REBOOT=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_MAIN_STACK_SIZE=4096

# Keep the QSPI/FAT path disabled until the fitted NOR device is confirmed.
CONFIG_EF800_BOOT_MAIN_FAILURE_LIMIT=3

# The second-level bootloader occupies the first fixed partition selected by
# app.overlay.
CONFIG_USE_DT_CODE_PARTITION=y
