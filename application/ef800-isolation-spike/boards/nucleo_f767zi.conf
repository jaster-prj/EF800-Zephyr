# SPDX-License-Identifier: Apache-2.0

CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_UART_INTERRUPT_DRIVEN=y

# The spike uses four explicit domain partitions plus a userspace stack. The
# F767ZI has eight MPU regions; disable the extra stack-guard region so the
# domain fits while retaining userspace, MPU, and execute-XOR-write checks.
CONFIG_MPU_STACK_GUARD=n
CONFIG_HW_STACK_PROTECTION=n
CONFIG_THREAD_LOCAL_STORAGE=n
CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SPI_NOR=y
