CONFIG_EF800_MAIN_WATCHDOG_TIMEOUT_MS=10000
CONFIG_EF800_MAIN_PROBE_FUEL_GAUGE_AT_STARTUP=n
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_CONSOLE=n
