CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MTP_CLASS=y
CONFIG_USBD_MTP_MAX_HANDLES=12
CONFIG_USBD_MTP_STORAGES_PER_INSTANCE=3
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_EF800_USB_VID=0x2fe3
