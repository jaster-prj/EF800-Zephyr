CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_USBD_MTP_CLASS=y
CONFIG_USBD_MTP_MAX_HANDLES=12
CONFIG_USBD_MTP_STORAGES_PER_INSTANCE=3
CONFIG_USBD_THREAD_STACK_SIZE=4096
CONFIG_EF800_USB_VID=0x2fe3
CONFIG_EF800_USB_PID=0xef87
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000
CONFIG_PINCTRL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_RESET=y
CONFIG_EF800_MAIN_WATCHDOG_TIMEOUT_MS=10000
CONFIG_EF800_MAIN_PROBE_FUEL_GAUGE_AT_STARTUP=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_USERSPACE=y
CONFIG_ARM_MPU=y
CONFIG_MPU_STACK_GUARD=y
CONFIG_HW_STACK_PROTECTION=y
CONFIG_EXECUTE_XOR_WRITE=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_EXCEPTION_DEBUG=y
CONFIG_EF800_MAIN_PLUGIN_USER_WORKER=y
# PluginManager scans by allocating a complete package buffer. Reserve enough
# libc arena for the manager plus the current independently packaged devices.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=32768
CONFIG_CONSOLE=n
