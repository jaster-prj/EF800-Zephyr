# SPDX-License-Identifier: Apache-2.0
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_I2C=y
CONFIG_WATCHDOG=y
CONFIG_RTC=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=n
CONFIG_MAIN_STACK_SIZE=2048

# The main image must stay behind the second-level bootloader and backup image.
CONFIG_USE_DT_CODE_PARTITION=y

# Zephyr logging uses the board console (USART1); the keyboard protocol stays
# on the separate lpuart1 link.
CONFIG_LOG=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_DEFAULT_LEVEL=3

# The external flash is optional and is disabled until the fitted part and
# its existing FAT contents are verified. The service never formats on mount.
CONFIG_EF800_MAIN_STORAGE=n
CONFIG_EF800_MAIN_USB_MSC=n
CONFIG_FS_FATFS_MOUNT_MKFS=n

# The keyboard link is a binary protocol, not a console.
# USB MSC is intentionally not enabled in MainApplication; it must not share
# the QSPI disk with the optional FAT service.
CONFIG_USB_DEVICE_STACK_NEXT=n
CONFIG_USBD_MSC_CLASS=n
