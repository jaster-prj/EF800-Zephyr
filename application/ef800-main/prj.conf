# SPDX-License-Identifier: Apache-2.0
CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_REENTRANT=y
CONFIG_NVS=y
CONFIG_NVS_DATA_CRC=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_GPIO_MCP230XX=y
CONFIG_MFD=y
CONFIG_RTC_DS3231=y
CONFIG_WATCHDOG=y
CONFIG_RTC=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_STACK_SIZE=8192
CONFIG_NET_BUF=y
CONFIG_ZCBOR=y
CONFIG_BASE64=y
CONFIG_CRC=y
CONFIG_PLUGIN_MANAGER=y
CONFIG_PLUGIN_MANAGER_ZEPHYR_FS=y
CONFIG_APPLICATION_DEFINED_SYSCALL=y
CONFIG_MCUMGR=y
CONFIG_MCUMGR_GRP_FS=y
CONFIG_MCUMGR_TRANSPORT_SHELL=y
CONFIG_MCUMGR_TRANSPORT_NETBUF_SIZE=512
CONFIG_MCUMGR_TRANSPORT_NETBUF_COUNT=8
CONFIG_MCUMGR_GRP_FS_PATH_LEN=64
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_REBOOT=y

# Zephyr logging uses the board console (USART1); the keyboard protocol stays
# on the separate lpuart1 link.
CONFIG_LOG=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_BOOT_BANNER=y
CONFIG_LOG_DEFAULT_LEVEL=3

# The service never formats the external FAT volume on a mount failure.
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_EF800_MAIN_STORAGE_FORMAT_ON_MOUNT_FAILURE=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FS_FATFS_MKFS=y
# Development migration only; set to n before producing production firmware.
CONFIG_EF800_MAIN_REFORMAT_LEGACY_QSPI=y

# The keyboard link is a binary protocol, not a console.
