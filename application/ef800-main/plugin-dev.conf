# DEVELOPMENT-ONLY: permits trusted local PluginManager packages to execute
# inline while the isolated worker/W^X and package-signature gates are pending.
# This is not an isolation boundary. Never use with untrusted PMP files.
CONFIG_EF800_MAIN_PLUGIN_DEV_DIRECT_EXECUTION=y
CONFIG_ARM_MPU=n
CONFIG_MPU_STACK_GUARD=n
