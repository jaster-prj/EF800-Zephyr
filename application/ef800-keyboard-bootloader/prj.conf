CONFIG_IS_BOOTLOADER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_HWINFO=y
CONFIG_WATCHDOG=y
# Software-started IWDG: do not enable an option-byte/hardware-started IWDG.
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=2048
