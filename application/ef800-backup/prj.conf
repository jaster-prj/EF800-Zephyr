CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_FLASH=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512

CONFIG_EF800_BACKUP_USB_MSC=y
CONFIG_EF800_USB_VID=0x2fe3
CONFIG_EF800_USB_PID=0xef80

# Recovery mode has no console workload; keep the image within the legacy
# 64 KiB backup partition.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
CONFIG_MAIN_STACK_SIZE=2048

# Deliberately do not enable FILE_SYSTEM/FAT_FILESYSTEM_ELM here. MSC owns
# the disk while the host is connected, so the recovery app must not mount it.
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n

# The recovery image occupies the fixed backup partition selected by
# app.overlay.
CONFIG_USE_DT_CODE_PARTITION=y
