# SPDX-License-Identifier: Apache-2.0
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_PINCTRL=y
CONFIG_GPIO=y
CONFIG_CLOCK_CONTROL=y
CONFIG_RESET=y
CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_LOG=y
CONFIG_LOG_BACKEND_UART=n
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_WATCHDOG=y
CONFIG_IWDG_STM32_INITIAL_TIMEOUT=10000
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y

CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MTP_CLASS=y
CONFIG_USBD_MTP_MAX_HANDLES=12
CONFIG_USBD_MTP_STORAGES_PER_INSTANCE=4
CONFIG_USBD_THREAD_STACK_SIZE=4096

CONFIG_EF800_USB_VID=0x2fe3
CONFIG_EF800_USB_PID=0xef80
# Recovery mode must remain within the expanded 128 KiB backup partition.
CONFIG_MAIN_STACK_SIZE=2048

# The recovery image occupies the fixed backup partition selected by app.overlay.
CONFIG_USE_DT_CODE_PARTITION=y
