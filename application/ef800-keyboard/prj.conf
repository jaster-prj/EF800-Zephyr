# SPDX-License-Identifier: Apache-2.0
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_REBOOT=y
# The bootloader starts IWDG; the application only inherits and feeds it.
CONFIG_WATCHDOG=y
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MAIN_STACK_SIZE=2048

# The protocol UART is not a human-readable console.
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
