# SPDX-License-Identifier: Apache-2.0
CONFIG_MAIN_STACK_SIZE=8192
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_STACK_SIZE=3072
CONFIG_NEWLIB_LIBC=n
CONFIG_PRINTK=y
# Development smoke test: the loader executes plugin text from RAM. Production
# deployments must provide an executable plugin region and an MPU policy.
CONFIG_ARM_MPU=n
CONFIG_SPI=y
CONFIG_FLASH=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_JESD216_API=y
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MAX_SS=4096
CONFIG_FS_FATFS_MIN_SS=4096
CONFIG_FS_FATFS_WINDOW_ALIGNMENT=4
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_MKFS=y
CONFIG_PLUGIN_MANAGER=y
