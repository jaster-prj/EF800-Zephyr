# SPDX-License-Identifier: Apache-2.0

# The image replaces the normal internal flash image during bench testing.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_EF800_HWDEBUG_QSPI_HAL=y

CONFIG_GPIO=y
CONFIG_HWINFO=y
CONFIG_SERIAL=y
CONFIG_CLOCK_CONTROL=y
CONFIG_PINCTRL=y
CONFIG_I2C=y
CONFIG_GPIO_MCP230XX=y
CONFIG_MFD=y
CONFIG_RTC=y
CONFIG_RTC_DS3231=y
CONFIG_FUEL_GAUGE=y
CONFIG_MAX17048=y
# The minimal new-PCB image has no watchdog or auxiliary peripherals.
CONFIG_WATCHDOG=y

# USB CDC-ACM is the only console transport in this temporary image. The
# application owns a small line-oriented command parser instead of pulling in
# the full Zephyr shell.
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_LINE_CTRL=y

# Keep driver diagnostics enabled while the target is being brought up. These
# messages are useful when the flash-disk write path is exercised through MSC.
CONFIG_LOG=n

# Storage ownership test: the test formats the QSPI volume only after an
# explicit console confirmation, then switches ownership between FAT and MSC.
CONFIG_DISK_DRIVERS=y
CONFIG_DISK_DRIVER_FLASH=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_MOUNT_MKFS=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_MSC_CLASS=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_USBD_MSC_LUNS_PER_INSTANCE=1
CONFIG_USBD_MSC_SCSI_BUFFER_SIZE=512
CONFIG_EF800_USB_VID=0x2fe3
CONFIG_EF800_USB_PID=0x0008
