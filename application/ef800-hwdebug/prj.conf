# SPDX-License-Identifier: Apache-2.0

# The image replaces only the second-level bootloader during bench testing.
CONFIG_USE_DT_CODE_PARTITION=y
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_FLASH_JESD216_API=y

# USB CDC-ACM is the only console transport in this temporary image. The
# application owns a small line-oriented command parser instead of pulling in
# the full Zephyr shell, so the image remains inside the 64 KiB boot partition.
CONFIG_UART_LINE_CTRL=y
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_USBD_CDC_ACM_CLASS=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y
CONFIG_CDC_ACM_SERIAL_ENABLE_AT_BOOT=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Jaster"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="EF800 HW Debug"
# Temporary engineering identifiers. Replace with an approved product VID/PID
# before any production USB deployment.
CONFIG_CDC_ACM_SERIAL_VID=0x2fe3
CONFIG_CDC_ACM_SERIAL_PID=0xef81

CONFIG_LOG=n

# The diagnostic application has no disk, FAT, USB MSC, update, or write path.
CONFIG_DISK_DRIVERS=n
CONFIG_DISK_DRIVER_FLASH=n
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_MOUNT_MKFS=n
CONFIG_USBD_MSC_CLASS=n
